<div class="rounded-xl border border-base-300 bg-base-200/50 p-6 backdrop-blur-sm">
    <h3 class="text-xs font-bold text-base-content/50 uppercase tracking-widest mb-4">Tags</h3>
    <div class="flex flex-wrap gap-2">
        {% for tc in tag_cloud %}
            <a href="{% pageurl page %}?tag={{ tc.tag__name }}"
               class="badge badge-outline hover:badge-secondary transition-colors gap-1 text-xs">
                #{{ tc.tag__name }}
                <span class="text-[10px] opacity-60">{{ tc.count }}</span>
            </a>
        {% endfor %}
    </div>
</div>
