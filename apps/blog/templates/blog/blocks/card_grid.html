{% load site_tags %}
<div class="my-10">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {% for card in self.block.value.cards %}
            <div class="card bg-base-200 border border-base-300 hover:border-primary/50 transition-all duration-300 p-6">
                <div class="text-primary mb-4">{% icon card.icon size=28 %}</div>
                <h3 class="text-lg font-bold text-base-content/85 mb-2">{{ card.title }}</h3>
                <p class="text-sm text-base-content/60 whitespace-pre-line">{{ card.description }}</p>
            </div>
        {% endfor %}
    </div>
</div>
