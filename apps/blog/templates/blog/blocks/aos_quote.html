<blockquote data-aos="{{ self.block.value.animation }}" data-aos-delay="{{ self.block.value.delay }}"
  class="border-l-2 border-primary/50 bg-base-200/30 py-3 px-4 text-base-content/60 italic my-6">
  "{{ self.block.value.quote }}"
  {% if self.block.value.attribution %}
    <footer class="mt-2 text-sm not-italic text-base-content/40">
      - {{ self.block.value.attribution }}
    </footer>
  {% endif %}
</blockquote>
