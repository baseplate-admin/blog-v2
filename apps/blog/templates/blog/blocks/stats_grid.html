<div class="my-10">
  <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
    {% for stat in self.block.value.stats %}
      <div class="text-center p-6 bg-base-200/50 border border-base-300/50 rounded-xl">
        <div class="text-3xl md:text-4xl font-bold text-primary mb-1">{{ stat.value }}</div>
        <div class="text-sm text-base-content/50 font-medium">{{ stat.label }}</div>
      </div>
    {% endfor %}
  </div>
</div>
