{% with site_conf=settings.site_settings.SiteConfigSettings %}
    <custom-footer
        site-name="{{ site_conf.site_name|default:'' }}"
        copyright-start="{{ site_conf.copyright_start_year|default:'' }}"
        copyright-end="{{ site_conf.copyright_end_year|default:'' }}"
        license="{{ site_conf.get_license_type_display|default:'' }}"
    ></custom-footer>
{% endwith %}
