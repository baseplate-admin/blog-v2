services:
  backend:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: blog
      restart: unless-stopped
      ports:
        - 8000:8000
      environment: &backend-variable
        POSTGRES_SERVER: postgres
        POSTGRES_PORT: 5432
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: supersecretpassword
        POSTGRES_DB: chithi
        DJANGO_ALLOWED_HOSTS: 'blog.zad.bd'
        DJANGO_CSRF_TRUSTED_ORIGINS: 'https://blog.zad.bd'

      networks:
            - proxy
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.blog.rule=Host(`blog.zad.bd`)"
        - "traefik.http.routers.blog.entrypoints=websecure"
        - "traefik.http.routers.blog.tls=true"
        - "traefik.http.routers.blog.tls.certresolver=letsencrypt"
        - "traefik.http.services.blog.loadbalancer.server.port=8000"


networks:
  proxy:
    external: true