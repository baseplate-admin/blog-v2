services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: blog
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: blog-backend
      restart: unless-stopped
      environment:
        POSTGRES_SERVER: postgres
        POSTGRES_PORT: 5432
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: supersecretpassword
        POSTGRES_DB: blog
        POSTGRES_HOST: postgres

      networks:
            - proxy
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.blog-backend.rule=Host(`blog.zad.bd`)"
        - "traefik.http.routers.blog-backend.entrypoints=websecure"
        - "traefik.http.routers.blog-backend.tls=true"
        - "traefik.http.routers.blog-backend.tls.certresolver=letsencrypt"
        - "traefik.http.services.blog-backend.loadbalancer.server.port=8000"


networks:
  proxy:
    external: true


volumes:
  postgres_data: