services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: blog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog
    restart: unless-stopped
    ports:
      - 8001:8000
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: blog
      DJANGO_ALLOWED_HOSTS: 'blog.zad.bd,localhost,127.0.0.1,blog'
      DJANGO_CSRF_TRUSTED_ORIGINS: 'https://blog.zad.bd,http://blog:8000'

    networks:
      - proxy
      - backend_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blog.rule=Host(`blog.zad.bd`)"
      - "traefik.http.routers.blog.entrypoints=websecure"
      - "traefik.http.routers.blog.tls=true"
      - "traefik.http.routers.blog.tls.certresolver=letsencrypt"
      - "traefik.http.services.blog.loadbalancer.server.port=8000"

networks:
  proxy:
    external: true
  backend_net:
    driver: bridge
    internal: true

volumes:
  postgres_data: