services:
  postgres:
    container_name: postgres_db
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: blog
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend_net  # This is fine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blog"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog
    restart: unless-stopped
   
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: blog
      DJANGO_ALLOWED_HOSTS: 'blog.zad.bd,localhost,127.0.0.1,blog'
      DJANGO_CSRF_TRUSTED_ORIGINS: 'https://blog.zad.bd,http://blog:8000'
    depends_on:
          postgres:
            condition: service_healthy
    networks:
      - backend_net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy" 
      - "traefik.http.routers.blog.rule=Host(`blog.zad.bd`)"
      - "traefik.http.routers.blog.entrypoints=websecure"
      - "traefik.http.routers.blog.tls=true"
      - "traefik.http.routers.blog.tls.certresolver=letsencrypt"
      - "traefik.http.services.blog.loadbalancer.server.port=8000"

networks:
  proxy:
    external: true
  backend_net:
    driver: bridge
    internal: true

volumes:
  postgres_data: